<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse; 
            border: 1px solid black;
        }

        td {
            border: 1px solid black;
            padding: 40px 15px; 
            font-family: sans-serif;
            font-size: 16px;
        }

        .cell-1 {
            background-color: #bada55; 
            width: 50%;
        }

        .cell-2 {
            background-color: #ffc0a9; 
            width: 50%;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="cell-1">First cell</td>
            <td class="cell-2">Second cell</td>
        </tr>
    </table>

</body>
</html>
