<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }

        table {
            width: 100vw;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed; 
        }

        td {
            border: 1px solid black;
            font-family: sans-serif;
            font-size: 16px;
            padding: 15px;
            vertical-align: middle;
        }

        .cell-1 {
            background-color: #bada55;
            width: 50%;
        }

        .cell-2 {
            background-color: #ffc0a9;
            width: 50%;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-1">First cell</td>
            <td class="cell-2">Second cell</td>
        </tr>
    </table>

</body>
</html>
