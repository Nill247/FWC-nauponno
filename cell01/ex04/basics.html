<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 2.5rem;
            margin-top: 20px;
        }

        .shops-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap; 
        }

        .shop-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-card img {
            width: 250px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .shop-card a {
            margin-top: 12px;
            color: white;
            font-weight: bold;
            text-decoration: underline;
        }

        .shop-card a:hover {
            color: #333;
        }

        hr {
            border: 0;
            height: 2px;
            background-color: white;
            width: 100%;
            margin: 30px 0 15px 0;
        }

        footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            color: white;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>Online Shops & Deals</h1>

    <div class="shops-container">
        <div class="shop-card">
            <img src="https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=400" alt="Online Clothing Shop">
            <a href="https://www.example1.com" target="_blank">Shop Fashion</a>
        </div>
        <div class="shop-card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400" alt="Online Gadget Shop">
            <a href="https://www.example2.com" target="_blank">Shop Gadgets</a>
        </div>
    </div>

    <hr>

    <footer>
        © nuponno 2026
    </footer>

</body>
</html>
